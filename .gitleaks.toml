# gitleaks (CI, .github/workflows/security.yml): barra chave ou senha nova num PR antes
# de ela entrar no repo. Este repo é PÚBLICO: o que entra aqui o mundo lê. O secret
# scanning do GitHub já barra chave de fornecedor conhecido; o gitleaks pega também o
# genérico (senha, token sem formato), que o GitHub só faz no plano pago.
#
# Exceções = achados da varredura do histórico inteiro em 13/11/2026, todos conferidos:
# nenhum é chave viva.
[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conferidos em 13/11/2026"
paths = [
  # "apiKeyPlaceholder" das traduções: texto de exemplo do campo.
  '''^src/i18n/locales/[^/]+/journey\.json$''',
  # Plano de feature com `Bearer FAKE_JWT` de propósito.
  '''^_bmad/implementation/spec-tutorial-lm-flow\.md$''',
]
