name: Security

# Chave ou senha nova barrada antes de entrar no repo (auditoria, Fase 5, 13/11/2026).
# Repo público: o que entra aqui o mundo lê. Versão fixa do gitleaks, conferida pelo
# sha256. Varre só os commits novos (do PR ou do push); o histórico foi varrido em
# 13/11 e as exceções estão em .gitleaks.toml.
# Achou? Tirar o segredo do commit (reescrever o PR) e trocar a chave no fornecedor:
# num repo público ela já pode ter sido copiada.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
      - name: Varrer os commits novos
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            RANGE="${BASE_SHA}..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            RANGE="${BEFORE}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE"
